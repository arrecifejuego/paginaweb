<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrecife — Jugar</title>
  <meta name="description" content="Jugá Arrecife online contra bots. El juego de mesa de lectura social.">
  <link rel="icon" type="image/x-icon" href="https://arrecifejuego.github.io/paginaweb/Logo-Blanco.ico">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&family=Tenor+Sans&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #050a0d; color: rgba(255,255,255,0.85); font-family: 'Tenor Sans', sans-serif; }

    /* FONDO */
    canvas#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* CONTENEDOR */
    #app { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 32px 18px 60px; }

    /* HEADER */
    .header { text-align: center; margin-bottom: 32px; }
    .header h1 { font-family: 'Cormorant Garamond', serif; font-size: 38px; letter-spacing: 8px; text-transform: uppercase; color: white; margin-bottom: 6px; }
    .header .sub { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: rgba(100,210,230,0.35); }

    /* PANTALLA INICIO */
    .inicio { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 32px 0 48px; }
    .inicio p { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; color: rgba(255,255,255,0.3); text-align: center; line-height: 2; }
    .input-nombre { background: transparent; border: none; border-bottom: 1px solid rgba(100,210,230,0.3); color: white; font-family: 'Cormorant Garamond', serif; font-size: 24px; text-align: center; padding: 8px 16px; width: 280px; outline: none; letter-spacing: 2px; transition: border-color 0.2s; }
    .input-nombre::placeholder { color: rgba(255,255,255,0.12); }
    .input-nombre:focus { border-bottom-color: rgba(100,210,230,0.8); }
    .btn-entrar { padding: 14px 40px; border-radius: 6px; border: 1px solid rgba(100,210,230,0.35); background: transparent; color: rgba(100,210,230,0.8); font-family: 'Tenor Sans', sans-serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
    .btn-entrar:hover { background: rgba(100,210,230,0.08); border-color: rgba(100,210,230,0.7); }

    /* HP JUGADORES */
    .jugadores { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .jhp { flex: 1; min-width: 110px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 10px 12px; }
    .jhp.eliminado { opacity: 0.2; }
    .jn { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 4px; }
    .jam { color: rgba(255,200,80,0.8); margin-left: 4px; }
    .jhpv { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: white; margin-bottom: 5px; }
    .hpb { height: 3px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; }
    .hpf { height: 100%; border-radius: 2px; transition: width 0.6s; }
    .jtag { font-size: 8px; margin-top: 4px; opacity: 0.3; letter-spacing: 1px; }
    .jeq { font-size: 8px; margin-top: 3px; letter-spacing: 1px; font-style: italic; }

    /* FASE */
    .fase { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.18); text-align: center; margin-bottom: 16px; }

    /* MOMENTOS */
    .moms { display: flex; gap: 6px; margin-bottom: 14px; }
    .momd { width: 8px; height: 8px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); background: transparent; transition: all 0.3s; }
    .momd.a { border-color: rgba(100,210,230,1); background: rgba(100,210,230,1); }
    .momd.j { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.15); }

    /* CARTAS KIT */
    .st { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.18); margin-bottom: 10px; }
    .kit { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .carta { width: 56px; height: 80px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: pointer; transition: all 0.18s; flex-shrink: 0; overflow: hidden; position: relative; }
    .carta img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 7px; }
    .carta:hover { border-color: rgba(100,210,230,0.5); transform: translateY(-5px); }
    .carta.sel { border-color: rgba(100,210,230,1); transform: translateY(-8px); box-shadow: 0 0 18px rgba(100,210,230,0.3); }
    .carta.dis { opacity: 0.15; pointer-events: none; transform: none; }
    .carta-tip { position: relative; z-index: 1; background: rgba(0,0,0,0.65); font-size: 7px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.7); text-align: center; padding: 3px 0; width: 100%; }

    /* MESA */
    .mesa { background: rgba(255,255,255,0.015); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
    .mfila { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 10px; }
    .mfila:last-child { margin-bottom: 0; }
    .ml { font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.2); margin-bottom: 5px; }
    .mcs { display: flex; gap: 4px; }
    .mc { width: 38px; height: 54px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 12px; color: rgba(255,255,255,0.2); }
    .mc img { width: 100%; height: 100%; object-fit: cover; }

    /* BOTONES */
    .bots { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .btn { padding: 10px 20px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: rgba(255,255,255,0.45); font-family: 'Tenor Sans', sans-serif; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
    .btn:hover:not(:disabled) { border-color: rgba(100,210,230,0.35); color: rgba(100,210,230,0.8); }
    .btn:disabled { opacity: 0.2; cursor: default; }
    .btn.p { border-color: rgba(100,210,230,0.4); color: rgba(100,210,230,0.8); }
    .btn.p:hover { background: rgba(100,210,230,0.08); }

    /* LOG */
    .log { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 12px 14px; max-height: 140px; overflow-y: auto; margin-bottom: 12px; }
    .li { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; color: rgba(255,255,255,0.35); line-height: 1.8; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 3px; margin-bottom: 3px; }
    .li:last-child { border: none; color: rgba(255,255,255,0.65); }
    .li.d { color: rgba(100,210,230,0.7); }
    .li.dan { color: rgba(255,100,80,0.7); }
    .li.mar { color: rgba(80,200,160,0.7); }
    .li.tor { color: rgba(180,100,255,0.7); }

    /* FIN */
    .ganador { text-align: center; padding: 48px 20px; font-family: 'Cormorant Garamond', serif; }
    .ganador h2 { font-size: 32px; margin-bottom: 16px; }
    .ganador p { font-style: italic; font-size: 17px; color: rgba(255,255,255,0.38); line-height: 2; }
    .ganador a { display: inline-block; margin-top: 16px; font-family: 'Tenor Sans', sans-serif; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(100,210,230,0.4); text-decoration: none; }
    .ganador a:hover { color: rgba(100,210,230,0.8); }

    /* MOBILE */
    @media(max-width:500px){
      .header h1 { font-size: 28px; letter-spacing: 5px; }
      .jugadores { gap: 6px; }
      .jhp { min-width: 90px; padding: 8px 10px; }
      .jhpv { font-size: 17px; }
      .carta { width: 46px; height: 66px; }
      .mc { width: 32px; height: 46px; }
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="app">
  <div class="header">
    <h1>Arrecife</h1>
    <div class="sub">juego de lectura social</div>
  </div>
  <div id="cnt"></div>
</div>

<script>
// FONDO
(function(){
  const c=document.getElementById('bg'),ctx=c.getContext('2d');
  let W,H;const rs=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  document.addEventListener('click',e=>rs.push({x:e.clientX,y:e.clientY,r:0,a:0.5,s:2+Math.random()}));
  (function loop(){
    requestAnimationFrame(loop);
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#010d14');g.addColorStop(1,'#000608');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let i=rs.length-1;i>=0;i--){
      const r=rs[i];r.r+=r.s;r.a-=0.004;
      ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
      ctx.strokeStyle='rgba(100,210,230,'+(r.a*0.2)+')';ctx.lineWidth=1;ctx.stroke();
      if(r.a<=0)rs.splice(i,1);
    }
  })();
})();

const BASE_URL='https://arrecifejuego.github.io/paginaweb/';
const IMGS={'Algas':BASE_URL+'team_algas.jpeg','Corales':BASE_URL+'team_corales.jpeg',1:BASE_URL+'numero_1.jpeg',2:BASE_URL+'numero_2.jpeg',3:BASE_URL+'numero_3.jpeg',4:BASE_URL+'numero_4.jpeg',5:BASE_URL+'numero_5.jpeg','+':BASE_URL+'signo_mas.jpeg','-':BASE_URL+'signo_menos.jpeg'};
const CRIATURAS=['Medusa','Cangrejo','Erizo','Pulpo'];
let G={},nombreJugador='';

function hpC(hp,mx){return hp/mx>0.5?'rgba(100,210,230,0.8)':hp/mx>0.25?'rgba(255,200,80,0.8)':'rgba(255,80,80,0.8)';}

function init(nombre){
  nombreJugador=nombre||'Vos';
  G={ronda:1,mom:0,
    jugs:[
      {n:nombreJugador,hp:30,mhp:30,am:true,bot:false},
      {n:'Medusa',hp:30,mhp:30,am:false,bot:true},
      {n:'Cangrejo',hp:30,mhp:30,am:false,bot:true},
      {n:'Erizo',hp:30,mhp:30,am:false,bot:true}
    ],
    mesa:[{},{},{},{}],
    us:[{e:false,v:false,s:false},{e:false,v:false,s:false},{e:false,v:false,s:false},{e:false,v:false,s:false}],
    sel:null,log:[],hist:[]
  };
}

function mostrarInicio(){
  document.getElementById('cnt').innerHTML=`
    <div class="inicio">
      <p>En este mar, sobrevive<br>quien mejor interpreta a los demás.</p>
      <input class="input-nombre" id="inp" type="text" placeholder="tu nombre" maxlength="14" autocomplete="off"/>
      <button class="btn-entrar" onclick="comenzar()">Entrar al mar</button>
    </div>`;
  const inp=document.getElementById('inp');
  if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')comenzar();});
}

function comenzar(){
  const v=(document.getElementById('inp').value||'').trim();
  init(v);
  aLog('— ronda 1 —','d');
  rKit();
}

function aLog(msg,t=''){
  G.log.push({msg,t});
  const el=document.getElementById('lb');
  if(el){const d=document.createElement('div');d.className='li'+(t?' '+t:'');d.textContent=msg;el.appendChild(d);el.scrollTop=el.scrollHeight;}
}

function mv(){return G.jugs.filter(j=>j.hp>0).length>4?5:4;}
function falt(i){const u=G.us[i],f=[];if(!u.e)f.push('equipo');if(!u.v)f.push('valor');if(!u.s)f.push('signo');return f;}

// ── INTELIGENCIA ──
function predecirEq(idx){
  if(G.hist.length<2)return['Algas','Corales'][Math.floor(Math.random()*2)];
  const ults=G.hist.slice(-5).map(r=>r[0]&&r[0].eq).filter(Boolean);
  const cA=ults.filter(e=>e==='Algas').length,cC=ults.filter(e=>e==='Corales').length;
  let alterna=true;
  for(let i=1;i<ults.length;i++)if(ults[i]===ults[i-1]){alterna=false;break;}
  let predEze=alterna&&ults.length>=2?ults[ults.length-1]==='Algas'?'Corales':'Algas':cA>cC?'Algas':'Corales';
  const botHp=G.jugs[idx].hp;
  const maxHp=Math.max(...G.jugs.filter(j=>j.hp>0).map(j=>j.hp));
  if(botHp===maxHp)return predEze==='Algas'?'Corales':'Algas';
  if(botHp<12)return predEze;
  return predEze==='Algas'?'Corales':'Algas';
}

function elegirSigno(idx,miEq,miVal){
  let sumaActual=0,cMiEq=0,cOtro=0;
  G.jugs.forEach((j,i)=>{
    if(j.hp<=0||i===idx)return;
    if(G.mesa[i].equipo===miEq){cMiEq++;if(G.mesa[i].valor&&G.mesa[i].signo)sumaActual+=G.mesa[i].valor*(G.mesa[i].signo==='-'?-1:1);}
    else if(G.mesa[i].equipo)cOtro++;
  });
  const esMay=cMiEq+1>cOtro;
  const botHp=G.jugs[idx].hp;
  if(esMay){
    if(botHp<10){const a=sumaActual+miVal,b=sumaActual-miVal;return Math.abs(b)<Math.abs(a)?'-':'+';}
    const a=sumaActual+miVal,b=sumaActual-miVal;
    return Math.abs(a)>Math.abs(b)?'+':'-';
  } else {
    const a=sumaActual+miVal,b=sumaActual-miVal;
    return Math.abs(a)<Math.abs(b)?'+':'-';
  }
}

function botElige(idx){
  const f=falt(idx);if(!f.length)return null;
  const maxV=mv();
  // En el primer momento (los tres tipos disponibles), el bot elige estratégicamente
  // qué tipo jugar primero según la situación
  let tipo;
  if(f.length===3){
    // Momento 1: puede elegir cualquier tipo
    // Estrategia: si tiene info de rondas anteriores, empezar por equipo para dar señal falsa
    // Si no tiene historia, aleatorio entre los tres
    if(G.hist.length===0){
      tipo=f[Math.floor(Math.random()*3)];
    } else {
      // Empezar por equipo para establecer posición (bluff o real)
      tipo='equipo';
    }
  } else {
    // Momentos 2 y 3: elegir de los disponibles en orden estratégico
    // Si le falta equipo, jugarlo ahora para poder calcular signo después
    if(f.includes('equipo'))tipo='equipo';
    else if(f.includes('valor'))tipo='valor';
    else tipo='signo';
  }

  if(tipo==='equipo')return{tipo:'equipo',valor:predecirEq(idx)};
  if(tipo==='valor'){const botHp=G.jugs[idx].hp;return{tipo:'valor',valor:botHp<10?1:maxV};}
  if(tipo==='signo'){const miEq=G.mesa[idx].equipo;const miVal=G.mesa[idx].valor||3;return{tipo:'signo',valor:elegirSigno(idx,miEq,miVal)};}
  return null;
}

function rKit(){
  const f=falt(0);const u=G.us[0];const maxV=mv();
  let html='';

  // HP
  html+=`<div class="jugadores">`;
  G.jugs.forEach((j,i)=>{
    if(j.hp<=0){html+=`<div class="jhp eliminado"><div class="jn">${j.n} ✝</div><div class="jhpv">0</div></div>`;return;}
    const p=Math.max(0,j.hp/j.mhp*100);
    const eq=G.mesa[i]&&G.mesa[i].equipo;
    html+=`<div class="jhp">
      <div class="jn">${j.n}${j.am?'<span class="jam">✦</span>':''}</div>
      <div class="jhpv">${j.hp} HP</div>
      <div class="hpb"><div class="hpf" style="width:${p}%;background:${hpC(j.hp,j.mhp)}"></div></div>
      <div class="jtag">${j.bot?'bot':'vos'}</div>
      ${eq?`<div class="jeq" style="color:${eq==='Algas'?'rgba(80,200,160,0.7)':'rgba(220,120,90,0.7)'}">${eq}</div>`:''}
    </div>`;
  });
  html+=`</div>`;

  html+=`<div class="fase">ronda ${G.ronda} — momento ${G.mom+1} de 3</div>`;
  html+=`<div class="moms">${[0,1,2].map(i=>`<div class="momd ${i<G.mom?'j':i===G.mom?'a':''}"></div>`).join('')}</div>`;

  // Kit
  html+=`<div class="st">tu kit — disponibles: ${f.join(', ')||'—'}</div><div class="kit">`;
  ['Algas','Corales'].forEach(eq=>{
    const dis=u.e||(G.mom>0&&!f.includes('equipo'));
    const s=G.sel&&G.sel.t==='equipo'&&G.sel.v===eq;
    html+=`<div class="carta ${s?'sel':''} ${dis?'dis':''}" onclick="doSel('equipo','${eq}')">
      <img src="${IMGS[eq]}" loading="lazy"/>
      <div class="carta-tip">${eq.toLowerCase()}</div>
    </div>`;
  });
  for(let v=1;v<=maxV;v++){
    const dis=u.v||(G.mom>0&&!f.includes('valor'));
    const s=G.sel&&G.sel.t==='valor'&&G.sel.v===v;
    html+=`<div class="carta ${s?'sel':''} ${dis?'dis':''}" onclick="doSel('valor',${v})">
      <img src="${IMGS[v]}" loading="lazy"/>
      <div class="carta-tip">${v}</div>
    </div>`;
  }
  ['+','-'].forEach(sg=>{
    const dis=u.s||(G.mom>0&&!f.includes('signo'));
    const s=G.sel&&G.sel.t==='signo'&&G.sel.v===sg;
    html+=`<div class="carta ${s?'sel':''} ${dis?'dis':''}" onclick="doSel('signo','${sg}')">
      <img src="${IMGS[sg]}" loading="lazy"/>
      <div class="carta-tip">${sg==='+'?'más':'menos'}</div>
    </div>`;
  });
  html+=`</div>`;

  // Mesa
  html+=`<div class="mesa"><div class="st">mesa</div>`;
  G.jugs.forEach((j,i)=>{
    if(j.hp<=0)return;
    const mc=G.mesa[i];
    html+=`<div class="mfila"><div>
      <div class="ml">${j.n}${j.am?' ✦':''}</div>
      <div class="mcs">
        <div class="mc">${mc.equipo?`<img src="${IMGS[mc.equipo]}" loading="lazy"/>`:'E'}</div>
        <div class="mc">${mc.valor?`<img src="${IMGS[mc.valor]}" loading="lazy"/>`:'V'}</div>
        <div class="mc">${mc.signo?`<img src="${IMGS[mc.signo]}" loading="lazy"/>`:'±'}</div>
      </div></div></div>`;
  });
  html+=`</div>`;

  html+=`<div class="bots"><button class="btn p" onclick="jugar()" ${!G.sel?'disabled':''}>Jugar carta</button></div>`;
  html+=`<div class="log" id="lb">${G.log.slice(-10).map(l=>`<div class="li ${l.t}">${l.msg}</div>`).join('')}</div>`;
  document.getElementById('cnt').innerHTML=html;
  const lb=document.getElementById('lb');if(lb)lb.scrollTop=lb.scrollHeight;
}

function doSel(t,v){
  if(!falt(0).includes(t))return;
  G.sel={t,v};rKit();
}

function jugar(){
  if(!G.sel)return;
  const{t,v}=G.sel;
  const tk=t==='equipo'?'equipo':t==='valor'?'valor':'signo';
  G.mesa[0][tk]=v;
  G.us[0][t==='equipo'?'e':t==='valor'?'v':'s']=true;
  G.sel=null;
  G.jugs.forEach((j,i)=>{
    if(i===0||j.hp<=0)return;
    const c=botElige(i);
    if(c){
      const tk2=c.tipo==='equipo'?'equipo':c.tipo==='valor'?'valor':'signo';
      G.mesa[i][tk2]=c.valor;
      G.us[i][c.tipo==='equipo'?'e':c.tipo==='valor'?'v':'s']=true;
    }
  });
  G.mom++;
  if(G.mom>=3)resolverRonda();
  else rKit();
}

function resolverRonda(){
  const vivos=G.jugs.filter(j=>j.hp>0);
  const n=vivos.length;
  G.hist.push(G.jugs.map((j,i)=>j.hp>0?{eq:G.mesa[i].equipo,val:G.mesa[i].valor,sig:G.mesa[i].signo}:null));

  const cnt={Algas:0,Corales:0};
  vivos.forEach(j=>{const ri=G.jugs.indexOf(j);if(G.mesa[ri].equipo)cnt[G.mesa[ri].equipo]++;});

  let may,men;
  if(cnt.Algas===n||cnt.Corales===n){
    const eq=cnt.Algas===n?'Algas':'Corales';
    const ai=G.jugs.findIndex(j=>j.am&&j.hp>0);
    aLog(`Todos eligieron ${eq} — ${G.jugs[ai].n} pasa a Minoría`,'d');
    G.mesa[ai].equipo=eq==='Algas'?'Corales':'Algas';
    const c2={Algas:0,Corales:0};
    vivos.forEach(j=>{const ri=G.jugs.indexOf(j);c2[G.mesa[ri].equipo]++;});
    may=c2.Algas>c2.Corales?'Algas':'Corales';men=may==='Algas'?'Corales':'Algas';
  } else if(cnt.Algas===cnt.Corales){
    const ai=G.jugs.findIndex(j=>j.am&&j.hp>0);
    may=G.mesa[ai].equipo;men=may==='Algas'?'Corales':'Algas';
    aLog(`Empate — ${G.jugs[ai].n} define Mayoría: ${may}`);
  } else {
    may=cnt.Algas>cnt.Corales?'Algas':'Corales';men=may==='Algas'?'Corales':'Algas';
  }
  aLog(`Mayoría: ${may} — Minoría: ${men}`);

  // Calcular sumas
  let sumaMay=0,sumaMen=0;
  vivos.forEach(j=>{
    const ri=G.jugs.indexOf(j);const mc=G.mesa[ri];
    const ap=(mc.valor||0)*(mc.signo==='-'?-1:1);
    if(mc.equipo===may)sumaMay+=ap;else sumaMen+=ap;
  });
  const absMay=Math.abs(sumaMay),absMen=Math.abs(sumaMen);
  aLog(`Suma Mayoría: ${sumaMay} (|${absMay}|) — Suma Minoría: ${sumaMen} (|${absMen}|)`);

  // MAREA: |Mayoría| = 0 → Minoría recupera 2 HP, no hay daño
  if(absMay===0){
    vivos.forEach(j=>{const ri=G.jugs.indexOf(j);if(G.mesa[ri].equipo===men){j.hp=Math.min(j.mhp,j.hp+2);}});
    aLog(`🌊 Marea — Minoría recupera 2 HP`,'mar');
  } else {
    // Determinar a quién va el daño según regla principal
    // Suma Mayoría > n → daño a Mayoría; Suma Mayoría <= n → daño a Minoría
    let eqDaño = absMay > n ? may : men;
    aLog(`Suma |${absMay}| ${absMay>n?'>':'≤'} ${n} jugadores → daño a ${eqDaño}`);

    // TORNADO: solo aplica si el daño iba a la Minoría
    // Si |Minoría| < |Mayoría| → el daño se redirige a la Mayoría
    if(eqDaño===men && absMen<absMay){
      eqDaño=may;
      aLog(`⚡ Tornado — |Minoría| ${absMen} < |Mayoría| ${absMay} → daño redirigido a Mayoría`,'tor');
    }

    vivos.forEach(j=>{
      const ri=G.jugs.indexOf(j);
      if(G.mesa[ri].equipo===eqDaño){
        j.hp=Math.max(0,j.hp-absMay);
        aLog(`${j.n} recibe ${absMay} → ${j.hp} HP`,'dan');
      }
    });
  }

  G.jugs.forEach(j=>{if(j.hp<=0&&!j.n.includes('✝')){aLog(`${j.n} eliminado`);j.n+=' ✝';}});

  const vp=G.jugs.filter(j=>j.hp>0);
  if(vp.length>1){
    const ai=G.jugs.findIndex(j=>j.am);
    if(ai>=0){G.jugs[ai].am=false;
      for(let i=1;i<=G.jugs.length;i++){
        const ni=(ai-i+G.jugs.length)%G.jugs.length;
        if(G.jugs[ni].hp>0){G.jugs[ni].am=true;break;}
      }
    }
  }

  const sob=G.jugs.filter(j=>j.hp>0);
  if(sob.length<=1){setTimeout(()=>fin(sob[0]),600);return;}

  G.ronda++;G.mom=0;
  G.mesa=G.jugs.map(()=>({}));
  G.us=G.jugs.map(()=>({e:false,v:false,s:false}));
  G.sel=null;
  aLog(`— ronda ${G.ronda} —`,'d');
  setTimeout(rKit,400);
}

function fin(j){
  const esJ=j&&j.n===nombreJugador;
  document.getElementById('cnt').innerHTML=`<div class="ganador">
    <h2 style="color:${esJ?'rgba(100,210,230,0.9)':'rgba(255,100,80,0.8)'}">${j?j.n.replace(' ✝',''):'?'} gana</h2>
    <p>${esJ?`Bien jugado, ${nombreJugador}.<br>Sabés leer el mar.`:'El mar no perdona.<br>¿Revancha?'}</p>
    <button class="btn p" style="margin-top:28px" onclick="mostrarInicio()">Nueva partida</button>
    <br><a href="https://www.arrecifejuego.com.ar" target="_blank">arrecifejuego.com.ar</a>
  </div>`;
}

mostrarInicio();
</script>
