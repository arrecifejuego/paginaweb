<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tutorial — Arrecife</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Tenor+Sans&display=swap" rel="stylesheet"/>
<style>
:root{--algas:rgba(80,200,160,1);--corales:rgba(220,120,90,1);--cyan:rgba(100,210,230,1);--bg:#050a0d;}
*{margin:0;padding:0;box-sizing:border-box;}
html{width:100%;height:100%;background:var(--bg);}body{width:100%;min-height:100%;background:var(--bg);color:white;overflow-x:hidden;overflow-y:auto;}
body{font-family:'Tenor Sans',sans-serif;}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.ocean{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
.wave{position:absolute;width:200%;height:200%;left:-50%;top:-50%;background:radial-gradient(circle at center,rgba(80,180,200,0.03),transparent 60%);animation:rotateWave 55s linear infinite;}
.wave2{animation-duration:85s;opacity:0.5;transform:scale(1.25);}
.wave3{animation-duration:120s;opacity:0.2;transform:scale(1.45);}
@keyframes rotateWave{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* layout ajustado para iframe Google Sites */
.container{position:relative;z-index:2;max-width:100%;margin:0 auto;padding:32px 20px 60px;}
.logo{font-size:10px;letter-spacing:10px;opacity:0.3;text-align:center;margin-bottom:20px;text-transform:uppercase;}
h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:36px;letter-spacing:2px;text-align:center;margin-bottom:8px;}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;opacity:0.35;text-align:center;margin-bottom:32px;}
.progreso{display:flex;gap:5px;justify-content:center;margin-bottom:32px;}
.prog-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.12);transition:background 0.4s;}
.prog-dot.activo{background:rgba(100,210,230,0.7);}
.prog-dot.hecho{background:rgba(100,210,230,0.3);}
.narracion{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;font-weight:300;line-height:1.8;text-align:center;opacity:0.85;margin-bottom:28px;letter-spacing:0.3px;min-height:60px;}
.narracion strong{font-style:normal;font-weight:400;color:rgba(100,210,230,0.9);}
.narracion em{opacity:0.6;}
.sep{width:40px;height:1px;background:rgba(100,210,230,0.2);margin:0 auto 28px;}

/* MESA */
.mesa{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:22px;}
.jugador{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 5px 6px;border:1px solid transparent;border-radius:3px;transition:border-color 0.5s,box-shadow 0.5s,transform 0.4s,opacity 0.4s;}
.jugador.glow-algas{border-color:rgba(80,200,160,0.45);box-shadow:0 0 18px rgba(80,200,160,0.18);transform:translateY(-2px);}
.jugador.glow-corales{border-color:rgba(220,120,90,0.45);box-shadow:0 0 18px rgba(220,120,90,0.18);transform:translateY(-2px);}
.jugador.glow-daño{border-color:rgba(220,80,80,0.45);box-shadow:0 0 18px rgba(220,80,80,0.18);animation:pulsoRojo 1s ease-in-out infinite;}
.jugador.glow-salvo{border-color:rgba(80,200,160,0.25);box-shadow:0 0 10px rgba(80,200,160,0.08);}
.jugador.dim{opacity:0.18;}
@keyframes pulsoRojo{0%,100%{box-shadow:0 0 10px rgba(220,80,80,0.15)}50%{box-shadow:0 0 26px rgba(220,80,80,0.38)}}
.jugador-nombre{font-size:8px;letter-spacing:2px;opacity:0.3;text-transform:uppercase;}
.jugador-amuleto{font-size:11px;line-height:1;color:rgba(255,220,80,0.7);}
.jugador-hp{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:1px;opacity:0.4;transition:all 0.4s;}
.jugador-hp.daño-hp{color:rgba(220,80,80,0.9);opacity:1;font-size:13px;animation:flashHP 0.5s ease;}
.jugador-hp.salvo-hp{color:rgba(80,200,160,0.7);opacity:0.8;}
@keyframes flashHP{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.cartas-jugador{display:flex;gap:3px;}
.carta{width:44px;border-radius:4px;overflow:hidden;position:relative;transition:transform 0.4s,box-shadow 0.4s;}
.carta img{width:100%;display:block;}
.carta.oculta img{display:none;}
.carta.oculta{background:linear-gradient(135deg,#0a1a24,#051018);border:1px solid rgba(100,210,230,0.1);height:62px;}
.carta.oculta::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 40% 35%,rgba(100,210,230,0.05),transparent 70%);}
.carta.revelada{animation:flipC 0.45s ease forwards;}
@keyframes flipC{0%{transform:rotateY(80deg) scale(0.9)}100%{transform:rotateY(0) scale(1)}}
.carta.glow-cyan-c{box-shadow:0 0 14px rgba(100,210,230,0.55)!important;transform:scale(1.1) translateY(-3px)!important;z-index:2;}
.carta.glow-algas-c{box-shadow:0 0 14px rgba(80,200,160,0.55)!important;transform:scale(1.1) translateY(-3px)!important;z-index:2;}
.carta.glow-corales-c{box-shadow:0 0 14px rgba(220,120,90,0.55)!important;transform:scale(1.1) translateY(-3px)!important;z-index:2;}

/* BADGES */
.equipos-label{display:flex;gap:10px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.equipo-badge{font-size:9px;letter-spacing:2px;padding:4px 12px;border:1px solid rgba(255,255,255,0.08);text-transform:uppercase;}
.equipo-badge.mayoria{border-color:rgba(100,210,230,0.3);color:rgba(100,210,230,0.8);}
.equipo-badge.minoria{opacity:0.35;}

/* SUMAS */
.sumas-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.suma-card{flex:1;min-width:130px;max-width:200px;border:1px solid rgba(255,255,255,0.07);padding:14px;text-align:center;}
.suma-card.mayoria-card{border-color:rgba(100,210,230,0.25);background:rgba(100,210,230,0.03);}
.suma-etiqueta{font-size:8px;letter-spacing:2px;opacity:0.3;margin-bottom:6px;text-transform:uppercase;}
.suma-num{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;line-height:1;}
.suma-detalle{font-size:9px;opacity:0.3;letter-spacing:1px;margin-top:4px;}

/* RESULTADO */
.resultado-box{border:1px solid rgba(100,210,230,0.18);background:rgba(100,210,230,0.03);padding:20px;text-align:center;margin-bottom:16px;}
.resultado-titulo{font-size:8px;letter-spacing:4px;opacity:0.3;margin-bottom:10px;text-transform:uppercase;}
.resultado-valor{font-family:'Cormorant Garamond',serif;font-size:44px;font-weight:300;line-height:1;margin-bottom:6px;}
.resultado-desc{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;opacity:0.45;letter-spacing:1px;}

/* EVENTO */
.evento-box{border:1px solid rgba(100,210,230,0.2);background:rgba(100,210,230,0.04);padding:16px 20px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden;}
.evento-box::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(100,210,230,0.06),transparent);animation:shimmer 2.5s ease-in-out infinite;}
.evento-box.tornado{border-color:rgba(180,80,80,0.3);background:rgba(180,80,80,0.04);}
.evento-box.tornado::before{background:linear-gradient(90deg,transparent,rgba(180,80,80,0.06),transparent);}
.evento-box.marea{border-color:rgba(80,180,220,0.3);background:rgba(80,180,220,0.04);}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.evento-nombre{font-size:9px;letter-spacing:5px;opacity:0.4;margin-bottom:8px;text-transform:uppercase;}
.evento-desc{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;font-weight:300;line-height:1.6;}

/* DAÑO */
.daño-summary{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.daño-card{padding:10px 12px;text-align:center;border:1px solid transparent;border-radius:2px;min-width:80px;}
.daño-card.recibe{border-color:rgba(220,80,80,0.35);background:rgba(220,80,80,0.06);}
.daño-card.salvo{border-color:rgba(80,200,160,0.2);background:rgba(80,200,160,0.03);}
.daño-card-nombre{font-size:8px;letter-spacing:2px;opacity:0.4;margin-bottom:5px;text-transform:uppercase;}
.daño-card-hp{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300;}
.daño-card-hp .antes{opacity:0.3;font-size:12px;text-decoration:line-through;margin-right:4px;}
.daño-card-hp .despues.rojo{color:rgba(220,80,80,0.9);}
.daño-card-hp .despues.verde{color:rgba(80,200,160,0.8);}

/* BOTONES */
.btn-wrap{text-align:center;margin-top:28px;}
.btn-avanzar{background:transparent;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.45);padding:11px 40px;font-family:'Tenor Sans',sans-serif;font-size:10px;letter-spacing:4px;cursor:pointer;text-transform:uppercase;transition:all 0.3s;position:relative;overflow:hidden;}
.btn-avanzar::before{content:'';position:absolute;inset:0;background:rgba(100,210,230,0.06);opacity:0;transition:opacity 0.3s;}
.btn-avanzar:hover::before{opacity:1;}
.btn-avanzar:hover{border-color:rgba(100,210,230,0.4);color:white;box-shadow:0 0 20px rgba(100,210,230,0.08);}
.btn-avanzar:active{transform:scale(0.98);}
.btn-reiniciar{display:none;margin:14px auto 0;background:transparent;border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.3);padding:9px 28px;font-family:'Tenor Sans',sans-serif;font-size:9px;letter-spacing:3px;cursor:pointer;text-transform:uppercase;transition:all 0.3s;}
.btn-reiniciar:hover{border-color:rgba(100,210,230,0.3);color:rgba(255,255,255,0.6);}
@media(max-width:480px){h1{font-size:28px;}.carta{width:36px;}.carta.oculta{height:51px;}.suma-num{font-size:28px;}.resultado-valor{font-size:34px;}.narracion{font-size:14px;}}

/* BOTÓN VOLVER */
.btn-volver{
  position:fixed;top:24px;left:24px;z-index:10;
  background:transparent;
  border:1px solid rgba(255,255,255,0.15);
  color:rgba(255,255,255,0.4);
  font-family:'Tenor Sans',sans-serif;
  font-size:10px;letter-spacing:3px;
  padding:8px 16px;cursor:pointer;
  text-decoration:none;
  text-transform:uppercase;
  transition:all 0.3s;
  display:flex;align-items:center;gap:8px;
}
.btn-volver:hover{
  border-color:rgba(100,210,230,0.4);
  color:rgba(100,210,230,0.8);
}
.btn-volver-arrow{font-size:14px;line-height:1;}

</style>
</head>
<body>
<a class="btn-volver" href="index.html">
  <span class="btn-volver-arrow">←</span>
  <span>Volver</span>
</a>
<canvas id="bg-canvas"></canvas>
<div class="ocean"><div class="wave"></div><div class="wave wave2"></div><div class="wave wave3"></div></div>
<div class="container">
  <div class="logo">Arrecife</div>
  <h1>Una ronda</h1>
  <div class="sub">observá cómo funciona el juego</div>
  <div class="progreso" id="progreso"></div>
  <div id="fase-wrap"></div>
  <div class="btn-wrap">
    <button class="btn-avanzar" id="btnAvanzar">continuar</button>
    <button class="btn-reiniciar" id="btnReiniciar">nueva ronda</button>
  </div>
</div>
<script>

const canvas=document.getElementById('bg-canvas');
const ctx=canvas.getContext('2d');
let W,H; const bgR=[];
function resC(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resC(); window.addEventListener('resize',resC);
function addR(x,y,c){bgR.push({x,y,r:0,a:0.6,s:2+Math.random(),c:c||'100,210,230'});}
document.addEventListener('click',e=>addR(e.clientX,e.clientY));
(function loop(){requestAnimationFrame(loop);ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#010d14');g.addColorStop(1,'#000608');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=bgR.length-1;i>=0;i--){const r=bgR[i];r.r+=r.s;r.a-=0.004;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${r.c},${r.a*0.22})`;ctx.lineWidth=1.2;ctx.stroke();
    if(r.a<=0)bgR.splice(i,1);}})();


const aC=new(window.AudioContext||window.webkitAudioContext)();
function tone(f,d,t,v,dl=0){const o=aC.createOscillator(),g=aC.createGain(),n=aC.currentTime+dl;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+0.02);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.connect(g);g.connect(aC.destination);o.start(n);o.stop(n+d);}
function sonarFlip(eq){const f=eq==='Algas'?380:280;tone(f,0.18,'sine',0.014);tone(f*1.5,0.14,'sine',0.005,0.06);}
function sonarPaso(){tone(320,0.1,'sine',0.011);}
function sonarDaño(){tone(120,0.4,'sawtooth',0.016);tone(80,0.5,'triangle',0.009,0.1);}
function sonarTornado(){tone(90,0.6,'sawtooth',0.018);tone(60,0.8,'triangle',0.01,0.15);}
function sonarMarea(){tone(480,0.8,'sine',0.016);tone(640,1,'sine',0.009,0.18);tone(820,0.9,'sine',0.006,0.38);}
function sonarFin(){tone(440,0.3,'sine',0.02);tone(660,0.4,'sine',0.011,0.2);tone(880,0.35,'sine',0.006,0.42);}

function rnd(n){ return Math.floor(Math.random()*n); }

function generarRonda(){
  const n = 3 + rnd(5);
  const maxVal = n<=4?4:5;
  const jugs = Array.from({length:n},(_,i)=>({
    nombre:`J ${i+1}`,
    equipo:rnd(2)?'Algas':'Corales',
    valor:1+rnd(maxVal),
    signo:rnd(2)?'+':'-',
    hp:30
  }));
  const ac=jugs.filter(j=>j.equipo==='Algas').length;
  if(ac===0) jugs[0].equipo='Algas';
  if(ac===n) jugs[n-1].equipo='Corales';

  const algasJ=jugs.filter(j=>j.equipo==='Algas');
  const coralesJ=jugs.filter(j=>j.equipo==='Corales');
  // amuleto en un jugador al azar
  const amuletoIdx = rnd(n);
  const amuleto = jugs[amuletoIdx].equipo;

  let mayoria,minoria;
  if(algasJ.length>coralesJ.length||(algasJ.length===coralesJ.length&&amuleto==='Algas')){
    mayoria={nombre:'Algas',jug:algasJ};minoria={nombre:'Corales',jug:coralesJ};
  } else {
    mayoria={nombre:'Corales',jug:coralesJ};minoria={nombre:'Algas',jug:algasJ};
  }

  const sumaMR=mayoria.jug.reduce((a,j)=>a+(j.signo==='+'?j.valor:-j.valor),0);
  const sumamR=minoria.jug.reduce((a,j)=>a+(j.signo==='+'?j.valor:-j.valor),0);
  const sumaM=Math.abs(sumaMR),sumam=Math.abs(sumamR),vivos=n;
  const marea=sumaM===0;
  const tornado=!marea&&sumam>sumaM;
  const dañoBase=sumaM>vivos?'mayoria':'minoria';
  const dañoEq=tornado?(dañoBase==='mayoria'?minoria.nombre:mayoria.nombre):(dañoBase==='mayoria'?mayoria.nombre:minoria.nombre);
  const hpFinal=jugs.map(j=>j.equipo===dañoEq?Math.max(0,j.hp-sumaM):j.hp);

  const tipos=['eq','val','sign'];
  const ordenRev=jugs.map(()=>{
    const o=[...tipos];
    for(let i=o.length-1;i>0;i--){const j=rnd(i+1);[o[i],o[j]]=[o[j],o[i]];}
    return o;
  });

  return {jugs,mayoria,minoria,sumaMR,sumamR,sumaM,sumam,vivos,marea,tornado,dañoEq,hpFinal,amuleto,amuletoIdx,ordenRev,maxVal};
}

function construirFases(R){
  const JJ=R.jugs, n=JJ.length;
  function revS(eq,val,sign){
    return {eq:Array.isArray(eq)?eq:Array(n).fill(eq),val:Array.isArray(val)?val:Array(n).fill(val),sign:Array.isArray(sign)?sign:Array(n).fill(sign)};
  }
  const rev1eq=JJ.map((_,i)=>R.ordenRev[i][0]==='eq'?1:0);
  const rev1val=JJ.map((_,i)=>R.ordenRev[i][0]==='val'?1:0);
  const rev1sign=JJ.map((_,i)=>R.ordenRev[i][0]==='sign'?1:0);
  const rev2eq=JJ.map((_,i)=>R.ordenRev[i][0]==='eq'||R.ordenRev[i][1]==='eq'?1:0);
  const rev2val=JJ.map((_,i)=>R.ordenRev[i][0]==='val'||R.ordenRev[i][1]==='val'?1:0);
  const rev2sign=JJ.map((_,i)=>R.ordenRev[i][0]==='sign'||R.ordenRev[i][1]==='sign'?1:0);
  const glow1=JJ.map((_,i)=>([{idx:i,tipo:R.ordenRev[i][0],clase:'glow-cyan-c'}])).flat();
  const glow2=JJ.map((_,i)=>([{idx:i,tipo:R.ordenRev[i][1],clase:'glow-cyan-c'}])).flat();
  const glow3=JJ.map((_,i)=>([{idx:i,tipo:R.ordenRev[i][2],clase:'glow-cyan-c'}])).flat();
  const glowSumas=JJ.flatMap((j,i)=>[
    {idx:i,tipo:'val',clase:j.equipo==='Algas'?'glow-algas-c':'glow-corales-c'},
    {idx:i,tipo:'sign',clase:j.equipo==='Algas'?'glow-algas-c':'glow-corales-c'}
  ]);
  const glowMayoria=JJ.map((j,i)=>([{idx:i,tipo:'eq',clase:j.equipo===R.mayoria.nombre?'glow-algas-c':'glow-corales-c'}])).flat();
  const empate=R.mayoria.jug.length===R.minoria.jug.length;
  const empateT=empate
    ? `<br><em>Hay empate. El amuleto está en <strong>J${R.amuletoIdx+1}</strong> (${R.amuleto}) — eso define la Mayoría.</em>`
    : '';
  const detMay=R.mayoria.jug.map(j=>`${j.signo==='+'?'+':'-'}${j.valor}`).join(' ');
  const detMin=R.minoria.jug.map(j=>`${j.signo==='+'?'+':'-'}${j.valor}`).join(' ');
  const comparaT=R.sumaM>R.vivos
    ?`<strong>${R.sumaM}</strong> supera los <strong>${R.vivos}</strong> jugadores — daño a la <strong>Mayoría</strong>.`
    :`<strong>${R.sumaM}</strong> no supera los <strong>${R.vivos}</strong> jugadores — daño a la <strong>Minoría</strong>.`;
  const dañoNombre=R.dañoEq===R.mayoria.nombre?'Mayoría':'Minoría';

  const fases=[
    {nar:`Hay <strong>${n} jugadores</strong>. Cada uno empieza con <strong>30 HP</strong>.<br>No pueden coordinar sus elecciones — <em>todo lo que hagas va a ser interpretado.</em>`,
     rev:revS(0,0,0),glowJ:[],glowC:[],btn:'cada uno elige en secreto'},
    {nar:`Cada jugador tiene 3 cartas: <strong>equipo</strong>, <strong>número</strong> y <strong>dirección</strong>.<br>La partida se juega en <strong>3 revelaciones simultáneas</strong>. En cada una, cada jugador elige en secreto qué carta jugar.<br><em>Nadie sabe qué eligieron los demás hasta que todos revelan a la vez.</em>`,
     rev:revS(0,0,0),glowJ:[],glowC:[],btn:'empieza la revelación'},
    {nar:`Cada jugador elige <strong>una carta en secreto</strong> y la acerca boca abajo.<br><em>Cuando todos están listos… la revelan al mismo tiempo.</em>`,
     rev:{eq:rev1eq,val:rev1val,sign:rev1sign},glowJ:[],glowC:glow1,btn:'segunda revelación simultánea',
     snd:()=>{if(aC.state==='suspended')aC.resume();setTimeout(()=>{JJ.forEach((j,i)=>setTimeout(()=>sonarFlip(j.equipo),i*40));},200);}},
    {nar:`Con lo que ya saben, eligen <strong>otra carta en secreto</strong>.<br><em>La tensión sube — todos revelan al mismo tiempo.</em>`,
     rev:{eq:rev2eq,val:rev2val,sign:rev2sign},glowJ:[],glowC:glow2,btn:'revelación final simultánea',
     snd:()=>{setTimeout(()=>{JJ.forEach((_,i)=>setTimeout(()=>tone(350+i*25,0.14,'sine',0.011),i*40));},200);}},
    {nar:`La última carta. Todos la revelan <strong>al mismo tiempo</strong>.<br><em>Recién acá se puede entender lo que pasó.</em>`,
     rev:revS(1,1,1),glowJ:[],glowC:glow3,btn:'ver quién es mayoría',
     snd:()=>{setTimeout(()=>{JJ.forEach((_,i)=>setTimeout(()=>tone(300-i*12,0.14,'sine',0.011),i*40));},200);}},
    {nar:`Se cuentan los equipos.<br><strong>${R.mayoria.nombre}</strong> tiene ${R.mayoria.jug.length} — Mayoría.${empateT}<br><strong>${R.minoria.nombre}</strong> tiene ${R.minoria.jug.length} — Minoría.`,
     rev:revS(1,1,1),
     glowJ:JJ.map((j,i)=>j.equipo===R.mayoria.nombre?{idx:i,clase:'glow-algas'}:{idx:i,clase:'dim'}),
     glowC:glowMayoria,
     extras:`<div class="equipos-label"><div class="equipo-badge mayoria">${R.mayoria.nombre} — mayoría (${R.mayoria.jug.length})</div><div class="equipo-badge minoria">${R.minoria.nombre} — minoría (${R.minoria.jug.length})</div></div>`,
     btn:'calcular las sumas',
     snd:()=>{tone(440,0.3,'sine',0.015);tone(550,0.25,'sine',0.008,0.12);}},
    {nar:`Cada jugador aporta su <strong>número</strong> con su <strong>dirección</strong>. Se suman por equipo en <strong>valor absoluto</strong>.`,
     rev:revS(1,1,1),glowJ:[],glowC:glowSumas,
     extras:`<div class="sumas-row"><div class="suma-card mayoria-card"><div class="suma-etiqueta">mayoría · ${R.mayoria.nombre}</div><div class="suma-num">${R.sumaMR}</div><div class="suma-detalle">${detMay} = ${R.sumaM}</div></div><div class="suma-card"><div class="suma-etiqueta">minoría · ${R.minoria.nombre}</div><div class="suma-num">${R.sumamR}</div><div class="suma-detalle">${detMin} = ${R.sumam}</div></div></div>`,
     btn:R.marea?'algo ocurrió':R.tornado?'hay algo más':'ver el resultado',
     snd:()=>{tone(320,0.2,'sine',0.014);tone(480,0.25,'sine',0.008,0.15);}},
  ];

  if(R.marea){
    fases.push({
      nar:`La suma de la Mayoría es <strong>0</strong>.<br><em>Algo se equilibra… aunque sea por un instante.</em>`,
      rev:revS(1,1,1),glowJ:[],glowC:[],
      extras:`<div class="evento-box marea"><div class="evento-nombre">Marea</div><div class="evento-desc">La Minoría recupera 2 HP. Es la única forma de recuperar vida.</div></div>`,
      btn:null,snd:sonarMarea
    });
  } else if(R.tornado){
    fases.push({
      nar:`La suma de la Minoría (<strong>${R.sumam}</strong>) supera a la de la Mayoría (<strong>${R.sumaM}</strong>).<br>El daño se <strong>invierte</strong>.`,
      rev:revS(1,1,1),
      glowJ:JJ.map((j,i)=>j.equipo===R.minoria.nombre?{idx:i,clase:'glow-corales'}:{idx:i,clase:'dim'}),
      glowC:[],
      extras:`<div class="evento-box tornado"><div class="evento-nombre">Tornado</div><div class="evento-desc">Un grupo más chico puede cambiar completamente el resultado.</div></div><div class="resultado-box"><div class="resultado-titulo">Resultado final</div><div class="resultado-valor">${R.sumaM}</div><div class="resultado-desc">de daño para <em>${R.dañoEq} — ${dañoNombre}</em></div></div>`,
      btn:'aplicar el daño',snd:sonarTornado
    });
  } else {
    fases.push({
      nar:`Hay <strong>${R.vivos}</strong> jugadores vivos. ${comparaT}`,
      rev:revS(1,1,1),
      glowJ:JJ.map((j,i)=>j.equipo===R.dañoEq?{idx:i,clase:'glow-daño'}:{idx:i,clase:'dim'}),
      glowC:[],
      extras:`<div class="resultado-box"><div class="resultado-titulo">Resultado final</div><div class="resultado-valor">${R.sumaM}</div><div class="resultado-desc">de daño para <em>${R.dañoEq} — ${dañoNombre}</em></div></div>`,
      btn:'aplicar el daño',snd:sonarDaño
    });
  }

  if(!R.marea){
    fases.push({
      nar:`El daño se aplica a cada jugador de <strong>${R.dañoEq}</strong>.<br><em>Todo vuelve a empezar… pero nadie es el mismo después de lo que vio.</em>`,
      rev:revS(1,1,1),
      glowJ:JJ.map((j,i)=>j.equipo===R.dañoEq?{idx:i,clase:'glow-daño'}:{idx:i,clase:'glow-salvo'}),
      glowC:[],hpFinal:R.hpFinal,
      extras:`<div class="daño-summary">${JJ.map((j,i)=>{const rec=j.equipo===R.dañoEq;return `<div class="daño-card ${rec?'recibe':'salvo'}"><div class="daño-card-nombre">${j.nombre} · ${j.equipo}</div><div class="daño-card-hp"><span class="antes">${j.hp}</span><span class="despues ${rec?'rojo':'verde'}">${R.hpFinal[i]} HP</span></div></div>`;}  ).join('')}</div>`,
      btn:null,snd:()=>setTimeout(sonarDaño,300)
    });
  }
  return fases;
}

function cartaEl(j,tipo,rev,glows){
  const key=tipo==='eq'?j.equipo:tipo==='val'?String(j.valor):j.signo;
  const src=IMGS[key];
  const g=(glows||[]).find(x=>x.idx===j._idx&&x.tipo===tipo);
  const cl=rev?`carta revelada${g?' '+g.clase:''}`:'carta oculta';
  return `<div class="${cl}">${rev&&src?`<img src="${src}"/>`:'<img/>'}</div>`;
}

function mesaHTML(JJ,rev,glowJ,glowC,hpArr,amuletoIdx){
  const hp=hpArr||JJ.map(j=>j.hp);
  let h='<div class="mesa">';
  JJ.forEach((j,i)=>{
    j._idx=i;
    const gj=(glowJ||[]).find(x=>x.idx===i);
    const jCl='jugador'+(gj?' '+gj.clase:'');
    const hpCl='jugador-hp'+(hpArr?(j.hp!==hpArr[i]?' daño-hp':' salvo-hp'):'');
    const gc=(glowC||[]).filter(x=>x.idx===i);
    const amuletoEl=i===amuletoIdx?`<div class="jugador-amuleto" title="Amuleto del mar">✦</div>`:'';
    h+=`<div class="${jCl}">
      <div class="jugador-nombre">${j.nombre}</div>
      ${amuletoEl}
      <div class="cartas-jugador">${cartaEl(j,'eq',rev.eq[i],gc)}${cartaEl(j,'val',rev.val[i],gc)}${cartaEl(j,'sign',rev.sign[i],gc)}</div>
      <div class="${hpCl}">${hp[i]} HP</div>
    </div>`;
  });
  return h+'</div>';
}

let RONDA,FASES,actual=0;

function iniciarRonda(){
  RONDA=generarRonda();FASES=construirFases(RONDA);actual=0;
  const prog=document.getElementById('progreso');prog.innerHTML='';
  for(let i=0;i<FASES.length;i++){const d=document.createElement('div');d.className='prog-dot'+(i===0?' activo':'');prog.appendChild(d);}
  render(0);
}

function render(n){
  const f=FASES[n],JJ=RONDA.jugs,wrap=document.getElementById('fase-wrap');
  document.querySelectorAll('.prog-dot').forEach((d,i)=>{d.className='prog-dot'+(i<n?' hecho':(i===n?' activo':''));});
  wrap.style.opacity='0';wrap.style.transform='translateY(12px)';
  setTimeout(()=>{
    wrap.innerHTML=`<div class="narracion">${f.nar}</div><div class="sep"></div>${f.extras||''}${mesaHTML(JJ,f.rev,f.glowJ,f.glowC,f.hpFinal||null,RONDA.amuletoIdx)}`;
    wrap.style.transition='opacity 0.7s ease,transform 0.7s ease';
    wrap.style.opacity='1';wrap.style.transform='translateY(0)';
  },180);
  const btn=document.getElementById('btnAvanzar'),btnR=document.getElementById('btnReiniciar');
  if(f.btn){btn.textContent=f.btn;btn.style.display='inline-block';btnR.style.display='none';}
  else{btn.style.display='none';btnR.style.display='block';sonarFin();}
  if(f.snd)setTimeout(f.snd,350);else sonarPaso();
  document.documentElement.scrollTop=0; document.body.scrollTop=0;
  addR(W/2,H/2);
}

document.getElementById('btnAvanzar').addEventListener('click',()=>{if(aC.state==='suspended')aC.resume();if(actual<FASES.length-1){actual++;render(actual);}});
document.getElementById('btnReiniciar').addEventListener('click',()=>{if(aC.state==='suspended')aC.resume();iniciarRonda();
